
title: My Obsidian Notes
description: My public knowledge base
url: "https://Mritunjay28.github.io"
baseurl: "/obsidian-notes"

theme: minima
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true
permalink: pretty

include:
  - content

collections:
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
