<script id="notes-index" type="application/json">[{% assign first = true %}{% assign notes = site.pages | where_exp: "p", "p.path contains 'content/'" | sort: "path" %}{% for n in notes %}{% assign parts = n.path | split: "/" %}{% assign group = "Others" %}{% assign sub = "" %}{% if parts.size > 2 %}{% assign group = parts[1] %}{% if parts.size > 3 %}{% assign sub_index = parts.size | minus: 2 %}{% assign sub = parts[sub_index] %}{% endif %}{% if sub == "SQL" %}{% assign group = "SQL" %}{% assign sub = "" %}{% endif %}{% assign sub_l = sub | downcase %}{% assign group_l = group | downcase %}{% if sub_l == group_l %}{% assign sub = "" %}{% endif %}{% endif %}{% unless first %},{% endunless %}{% assign first = false %}{"t":{{ n.name | remove: ".md" | jsonify }},"u":{{ n.url | relative_url | jsonify }},"g":{{ group | jsonify }},"s":{{ sub | jsonify }}}{% endfor %}]</script>
